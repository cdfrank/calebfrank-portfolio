# Groups the detailed discipline tags into the few filters people actually use.
capabilities:
  Product and UX: [Product, Enterprise UX, UX, Mobile, Prototyping, Portal, Interaction, Interactive, Motion, 3D, Voice, Authentication, Pilot, Concept, Sales enablement]
  Design systems: [Design systems, Architecture, Information architecture, Localization]
  Research and strategy: [Research, Strategy, Service design, New business, Audit, Business, Data, Data visualization]
  Web and commerce: [Web, Responsive, E-commerce, B2B, CRM, Email, Regulated, Content]
  Brand and campaign: [Brand, Campaign, Advertising, Art direction, Print, Editorial, Packaging, Outdoor, Events, Illustration]
  AI and games: [AI, Games, AR]
  Leadership: [Leadership, Education]

