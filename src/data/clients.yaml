# Controls the archive page. List order is display order.
# `match` lists every `client:` value from the project files that belongs in this group.
# A client not listed here still appears, with its name instead of a logo.
# Logos keep their color on the dark page unless listed under `whiteLogos` at the bottom.
# Use a transparent background for every logo file.
# Client and proposal groups use the supplied brand assets when available.
